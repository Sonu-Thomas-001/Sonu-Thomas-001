<svg fill="none" viewBox="0 0 1200 70" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0B0F19"/>
    </linearGradient>
    <linearGradient id="archBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="70" rx="12" fill="url(#archBg)" stroke="url(#archBorder)" stroke-width="1.5"/>

  <!-- Flow Line -->
  <path d="M 60 35 L 1140 35" stroke="#334155" stroke-width="3" stroke-dasharray="6,6"/>

  <!-- Animated Data Packet 1 -->
  <circle cx="0" cy="35" r="5" fill="#00F2FE">
    <animate attributeName="cx" from="60" to="1140" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- Animated Data Packet 2 -->
  <circle cx="0" cy="35" r="5" fill="#7C3AED">
    <animate attributeName="cx" from="60" to="1140" dur="4s" begin="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Nodes -->
  <g transform="translate(100, 18)">
    <rect width="160" height="34" rx="8" fill="#1E293B" stroke="#00F2FE" stroke-width="1"/>
    <text x="80" y="22" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#00F2FE">1. API Gateway</text>
  </g>

  <g transform="translate(360, 18)">
    <rect width="160" height="34" rx="8" fill="#1E293B" stroke="#7C3AED" stroke-width="1"/>
    <text x="80" y="22" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#7C3AED">2. Guardrail Proxy</text>
  </g>

  <g transform="translate(620, 18)">
    <rect width="170" height="34" rx="8" fill="#1E293B" stroke="#3B82F6" stroke-width="1"/>
    <text x="85" y="22" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#3B82F6">3. Agent Orchestrator</text>
  </g>

  <g transform="translate(890, 18)">
    <rect width="180" height="34" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="1"/>
    <text x="90" y="22" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#10B981">4. Telemetry &amp; Audit Log</text>
  </g>
</svg>
