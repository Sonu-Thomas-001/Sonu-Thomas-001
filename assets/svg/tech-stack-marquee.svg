<svg fill="none" viewBox="0 0 1200 110" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="marqueeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>

    <!-- Border Glow -->
    <linearGradient id="marqueeBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#7C3AED" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.6" />
    </linearGradient>

    <!-- Fade Overlay Mask -->
    <linearGradient id="fadeMask" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0B0F19" stop-opacity="1" />
      <stop offset="8%" stop-color="#0B0F19" stop-opacity="0" />
      <stop offset="92%" stop-color="#0B0F19" stop-opacity="0" />
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="1" />
    </linearGradient>

    <!-- Pill Styles -->
    <style>
      .pill { fill: #1E293B; stroke: #334155; stroke-width: 1.5; rx: 18; }
      .pill-cyan { fill: #0F172A; stroke: #00F2FE; stroke-width: 1.5; rx: 18; }
      .pill-purple { fill: #0F172A; stroke: #7C3AED; stroke-width: 1.5; rx: 18; }
      .pill-blue { fill: #0F172A; stroke: #3B82F6; stroke-width: 1.5; rx: 18; }
      .pill-orange { fill: #0F172A; stroke: #FF9900; stroke-width: 1.5; rx: 18; }
      .txt { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #F8FAFC; }
      .txt-glow { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #00F2FE; }
    </style>
  </defs>

  <!-- Container -->
  <rect width="1200" height="110" rx="14" fill="url(#marqueeBg)" stroke="url(#marqueeBorder)" stroke-width="1.5"/>

  <!-- Row 1: Infinite Leftward Scroll -->
  <g>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-1400 0" dur="22s" repeatCount="indefinite"/>
    
    <!-- First Group of Tech Badges -->
    <g transform="translate(0, 18)">
      <rect x="10" y="0" width="130" height="36" class="pill-cyan"/>
      <text x="75" y="23" text-anchor="middle" class="txt-glow">Python</text>

      <rect x="150" y="0" width="140" height="36" class="pill-purple"/>
      <text x="220" y="23" text-anchor="middle" class="txt">LangChain</text>

      <rect x="300" y="0" width="140" height="36" class="pill-cyan"/>
      <text x="370" y="23" text-anchor="middle" class="txt">LangGraph</text>

      <rect x="450" y="0" width="150" height="36" class="pill-blue"/>
      <text x="525" y="23" text-anchor="middle" class="txt">Vertex AI</text>

      <rect x="610" y="0" width="150" height="36" class="pill-cyan"/>
      <text x="685" y="23" text-anchor="middle" class="txt">Gemini Pro</text>

      <rect x="770" y="0" width="150" height="36" class="pill-orange"/>
      <text x="845" y="23" text-anchor="middle" class="txt">AWS Bedrock</text>

      <rect x="930" y="0" width="140" height="36" class="pill-purple"/>
      <text x="1000" y="23" text-anchor="middle" class="txt">Claude 3.5</text>

      <rect x="1080" y="0" width="140" height="36" class="pill-cyan"/>
      <text x="1150" y="23" text-anchor="middle" class="txt">ChromaDB</text>

      <rect x="1230" y="0" width="150" height="36" class="pill-blue"/>
      <text x="1305" y="23" text-anchor="middle" class="txt">PyTorch</text>
    </g>

    <!-- Duplicate Set for Seamless Loop -->
    <g transform="translate(1400, 18)">
      <rect x="10" y="0" width="130" height="36" class="pill-cyan"/>
      <text x="75" y="23" text-anchor="middle" class="txt-glow">Python</text>

      <rect x="150" y="0" width="140" height="36" class="pill-purple"/>
      <text x="220" y="23" text-anchor="middle" class="txt">LangChain</text>

      <rect x="300" y="0" width="140" height="36" class="pill-cyan"/>
      <text x="370" y="23" text-anchor="middle" class="txt">LangGraph</text>

      <rect x="450" y="0" width="150" height="36" class="pill-blue"/>
      <text x="525" y="23" text-anchor="middle" class="txt">Vertex AI</text>

      <rect x="610" y="0" width="150" height="36" class="pill-cyan"/>
      <text x="685" y="23" text-anchor="middle" class="txt">Gemini Pro</text>

      <rect x="770" y="0" width="150" height="36" class="pill-orange"/>
      <text x="845" y="23" text-anchor="middle" class="txt">AWS Bedrock</text>

      <rect x="930" y="0" width="140" height="36" class="pill-purple"/>
      <text x="1000" y="23" text-anchor="middle" class="txt">Claude 3.5</text>

      <rect x="1080" y="0" width="140" height="36" class="pill-cyan"/>
      <text x="1150" y="23" text-anchor="middle" class="txt">ChromaDB</text>

      <rect x="1230" y="0" width="150" height="36" class="pill-blue"/>
      <text x="1305" y="23" text-anchor="middle" class="txt">PyTorch</text>
    </g>
  </g>

  <!-- Row 2: Infinite Rightward Scroll -->
  <g>
    <animateTransform attributeName="transform" type="translate" from="-1400 0" to="0 0" dur="25s" repeatCount="indefinite"/>
    
    <g transform="translate(0, 60)">
      <rect x="10" y="0" width="130" height="36" class="pill-blue"/>
      <text x="75" y="23" text-anchor="middle" class="txt">React</text>

      <rect x="150" y="0" width="130" height="36" class="pill-purple"/>
      <text x="215" y="23" text-anchor="middle" class="txt">Next.js</text>

      <rect x="290" y="0" width="130" height="36" class="pill-cyan"/>
      <text x="355" y="23" text-anchor="middle" class="txt">FastAPI</text>

      <rect x="430" y="0" width="130" height="36" class="pill-blue"/>
      <text x="495" y="23" text-anchor="middle" class="txt">Node.js</text>

      <rect x="570" y="0" width="140" height="36" class="pill-cyan"/>
      <text x="640" y="23" text-anchor="middle" class="txt">Docker</text>

      <rect x="720" y="0" width="150" height="36" class="pill-purple"/>
      <text x="795" y="23" text-anchor="middle" class="txt">BigQuery</text>

      <rect x="880" y="0" width="140" height="36" class="pill-orange"/>
      <text x="950" y="23" text-anchor="middle" class="txt">Oracle DB</text>

      <rect x="1030" y="0" width="140" height="36" class="pill-blue"/>
      <text x="1100" y="23" text-anchor="middle" class="txt">TypeScript</text>

      <rect x="1180" y="0" width="130" height="36" class="pill-cyan"/>
      <text x="1245" y="23" text-anchor="middle" class="txt">Java</text>
    </g>

    <!-- Duplicate Set for Seamless Loop -->
    <g transform="translate(1400, 60)">
      <rect x="10" y="0" width="130" height="36" class="pill-blue"/>
      <text x="75" y="23" text-anchor="middle" class="txt">React</text>

      <rect x="150" y="0" width="130" height="36" class="pill-purple"/>
      <text x="215" y="23" text-anchor="middle" class="txt">Next.js</text>

      <rect x="290" y="0" width="130" height="36" class="pill-cyan"/>
      <text x="355" y="23" text-anchor="middle" class="txt">FastAPI</text>

      <rect x="430" y="0" width="130" height="36" class="pill-blue"/>
      <text x="495" y="23" text-anchor="middle" class="txt">Node.js</text>

      <rect x="570" y="0" width="140" height="36" class="pill-cyan"/>
      <text x="640" y="23" text-anchor="middle" class="txt">Docker</text>

      <rect x="720" y="0" width="150" height="36" class="pill-purple"/>
      <text x="795" y="23" text-anchor="middle" class="txt">BigQuery</text>

      <rect x="880" y="0" width="140" height="36" class="pill-orange"/>
      <text x="950" y="23" text-anchor="middle" class="txt">Oracle DB</text>

      <rect x="1030" y="0" width="140" height="36" class="pill-blue"/>
      <text x="1100" y="23" text-anchor="middle" class="txt">TypeScript</text>

      <rect x="1180" y="0" width="130" height="36" class="pill-cyan"/>
      <text x="1245" y="23" text-anchor="middle" class="txt">Java</text>
    </g>
  </g>

  <!-- Left & Right Gradient Mask Overlays -->
  <rect width="1200" height="110" rx="14" fill="url(#fadeMask)" pointer-events="none"/>
</svg>
