<svg fill="none" viewBox="0 0 490 195" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="strkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="strkBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" stroke-opacity="0.6"/>
      <stop offset="100%" stop-color="#00F2FE" stroke-opacity="0.6"/>
    </linearGradient>
  </defs>

  <rect width="490" height="195" rx="12" fill="url(#strkBg)" stroke="url(#strkBorder)" stroke-width="1.5"/>

  <!-- Title -->
  <text x="25" y="35" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="800" fill="#7C3AED" letter-spacing="1">
    Engineering Activity Streak
  </text>

  <!-- Divider line -->
  <line x1="25" y1="48" x2="465" y2="48" stroke="#334155" stroke-width="1"/>

  <!-- Col 1: Total Contributions -->
  <g transform="translate(45, 90)">
    <text x="70" y="0" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="28" font-weight="900" fill="#00F2FE">500+</text>
    <text x="70" y="24" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#94A3B8">Total Contributions</text>
    <text x="70" y="42" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="500" fill="#64748B">2024 — Present</text>
  </g>

  <!-- Vertical Divider -->
  <line x1="245" y1="70" x2="245" y2="160" stroke="#334155" stroke-width="1"/>

  <!-- Col 2: Active Consistency -->
  <g transform="translate(290, 90)">
    <text x="75" y="0" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="28" font-weight="900" fill="#7C3AED">Continuous</text>
    <text x="75" y="24" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#94A3B8">Engineering Cadence</text>
    <text x="75" y="42" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="500" fill="#64748B">Production-Grade AI</text>
  </g>
</svg>
