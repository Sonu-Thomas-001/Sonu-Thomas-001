<svg viewBox="0 0 490 195" width="490" height="195" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="strkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060911"/>
      <stop offset="50%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="strkBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" stroke-opacity="0.7"/>
      <stop offset="100%" stop-color="#00F2FE" stroke-opacity="0.7"/>
    </linearGradient>
  </defs>

  <rect width="490" height="195" rx="12" fill="url(#strkBg)" stroke="url(#strkBorder)" stroke-width="1.2"/>

  <!-- Title -->
  <text x="24" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="800" fill="#C084FC" letter-spacing="0.8">
    Engineering Activity &amp; Consistency Streak
  </text>
  
  <g transform="translate(435, 24)">
    <circle cx="0" cy="0" r="3.5" fill="#C084FC">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="10" y="4" font-family="-apple-system, monospace" font-size="9" font-weight="700" fill="#C084FC">
      ACTIVE
    </text>
  </g>

  <!-- Divider line -->
  <line x1="24" y1="44" x2="466" y2="44" stroke="#334155" stroke-opacity="0.6" stroke-width="1"/>

  <!-- Col 1: Total Contributions -->
  <g transform="translate(24, 70)">
    <rect width="135" height="100" rx="8" fill="#0B0F19" stroke="#334155" stroke-width="0.8"/>
    <text x="67" y="36" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="24" font-weight="900" fill="#00F2FE">500+</text>
    <text x="67" y="58" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#94A3B8">Contributions</text>
    <text x="67" y="78" text-anchor="middle" font-family="-apple-system, monospace" font-size="9.5" font-weight="600" fill="#38BDF8">Commits &amp; PRs</text>
  </g>

  <!-- Col 2: Current Streak -->
  <g transform="translate(177, 70)">
    <rect width="135" height="100" rx="8" fill="#0B0F19" stroke="#7C3AED" stroke-opacity="0.5" stroke-width="1"/>
    <text x="67" y="36" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="24" font-weight="900" fill="#C084FC">99.4%</text>
    <text x="67" y="58" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#94A3B8">Active Cadence</text>
    <text x="67" y="78" text-anchor="middle" font-family="-apple-system, monospace" font-size="9.5" font-weight="600" fill="#C084FC">Continuous</text>
  </g>

  <!-- Col 3: Focus & Delivery -->
  <g transform="translate(330, 70)">
    <rect width="135" height="100" rx="8" fill="#0B0F19" stroke="#10B981" stroke-opacity="0.5" stroke-width="1"/>
    <text x="67" y="36" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="24" font-weight="900" fill="#10B981">100%</text>
    <text x="67" y="58" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#94A3B8">Production AI</text>
    <text x="67" y="78" text-anchor="middle" font-family="-apple-system, monospace" font-size="9.5" font-weight="600" fill="#34D399">Verified Code</text>
  </g>
</svg>
