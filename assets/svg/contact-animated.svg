<svg fill="none" viewBox="0 0 1200 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="conBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="conBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="80" rx="12" fill="url(#conBg)" stroke="url(#conBorder)" stroke-width="1.5"/>

  <!-- Pulsing Radar Signal -->
  <g transform="translate(60, 40)">
    <circle cx="0" cy="0" r="16" fill="#00F2FE" fill-opacity="0.15">
      <animate attributeName="r" values="10;22;10" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="fill-opacity" values="0.3;0;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="6" fill="#00F2FE"/>
  </g>

  <text x="95" y="45" font-family="-apple-system, sans-serif" font-size="16" font-weight="800" fill="#F8FAFC" letter-spacing="1">LET'S CONNECT &amp; BUILD THE FUTURE OF ENTERPRISE AI</text>

  <!-- Animated CTA Button -->
  <g transform="translate(920, 20)">
    <rect width="240" height="40" rx="20" fill="#00F2FE" fill-opacity="0.1" stroke="#00F2FE" stroke-width="1.5">
      <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
    </rect>
    <text x="120" y="25" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" fill="#00F2FE">📬 OPEN FOR DISCUSSIONS</text>
  </g>
</svg>
