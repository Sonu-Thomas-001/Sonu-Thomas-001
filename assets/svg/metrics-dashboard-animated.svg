<svg fill="none" viewBox="0 0 1200 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="hudBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060911"/>
      <stop offset="50%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Neon Gradients -->
    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <linearGradient id="purpleNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <linearGradient id="emeraldNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <linearGradient id="amberNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>

    <!-- Shimmer Effect -->
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Container -->
  <rect width="1200" height="160" rx="16" fill="url(#hudBg)" stroke="#334155" stroke-width="1.2"/>

  <!-- ================= CARD 1: MTTR Impact ================= -->
  <g transform="translate(20, 18)">
    <rect width="270" height="124" rx="12" fill="url(#cardGrad)" stroke="#00F2FE" stroke-opacity="0.4" stroke-width="1.2"/>
    
    <!-- Header -->
    <text x="18" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#94A3B8" letter-spacing="1">
      ⚡ ENTERPRISE INCIDENT MTTR
    </text>
    
    <!-- Big Stat -->
    <text x="18" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="34" font-weight="900" fill="url(#cyanNeon)">
      -40%
    </text>
    <text x="135" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#38BDF8">
      Resolution Time
    </text>

    <!-- Progress Bar Container -->
    <rect x="18" y="92" width="234" height="6" rx="3" fill="#0B0F19"/>
    <!-- Animated Bar -->
    <rect x="18" y="92" width="180" height="6" rx="3" fill="url(#cyanNeon)">
      <animate attributeName="width" values="40;180;180" dur="2.5s" repeatCount="indefinite"/>
    </rect>
    <text x="18" y="114" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="500" fill="#64748B">
      Via Autonomous Multi-Agent RCA
    </text>
  </g>

  <!-- ================= CARD 2: Multi-Agent Architecture ================= -->
  <g transform="translate(310, 18)">
    <rect width="270" height="124" rx="12" fill="url(#cardGrad)" stroke="#818CF8" stroke-opacity="0.4" stroke-width="1.2"/>
    
    <!-- Header -->
    <text x="18" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#94A3B8" letter-spacing="1">
      🤖 PRODUCTION AGENTS
    </text>
    
    <!-- Big Stat -->
    <text x="18" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="34" font-weight="900" fill="url(#purpleNeon)">
      15+
    </text>
    <text x="95" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#C084FC">
      Active Workflows
    </text>

    <!-- Pulsing Radar Indicator -->
    <g transform="translate(230, 48)">
      <circle cx="0" cy="0" r="14" fill="#818CF8" fill-opacity="0.15">
        <animate attributeName="r" values="8;18;8" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="fill-opacity" values="0.3;0;0.3" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="0" r="6" fill="#A855F7"/>
    </g>

    <!-- Progress Bar -->
    <rect x="18" y="92" width="234" height="6" rx="3" fill="#0B0F19"/>
    <rect x="18" y="92" width="210" height="6" rx="3" fill="url(#purpleNeon)">
      <animate attributeName="width" values="80;210;210" dur="2.5s" repeatCount="indefinite"/>
    </rect>
    <text x="18" y="114" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="500" fill="#64748B">
      LangGraph • Vertex Builder • Bedrock
    </text>
  </g>

  <!-- ================= CARD 3: Professional Reach ================= -->
  <g transform="translate(600, 18)">
    <rect width="270" height="124" rx="12" fill="url(#cardGrad)" stroke="#10B981" stroke-opacity="0.4" stroke-width="1.2"/>
    
    <!-- Header -->
    <text x="18" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#94A3B8" letter-spacing="1">
      🌐 DEVELOPER NETWORK
    </text>
    
    <!-- Big Stat -->
    <text x="18" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="34" font-weight="900" fill="url(#emeraldNeon)">
      6,000+
    </text>
    <text x="145" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#34D399">
      LinkedIn Reach
    </text>

    <!-- Animated Sparkline Wave -->
    <path d="M 18 95 Q 60 85 100 95 T 160 88 T 220 96 T 250 85" fill="none" stroke="#10B981" stroke-width="2.2" stroke-linecap="round"/>
    
    <text x="18" y="114" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="500" fill="#64748B">
      HCLTech Brand Ambassador &amp; Speaker
    </text>
  </g>

  <!-- ================= CARD 4: Cloud Credentials ================= -->
  <g transform="translate(890, 18)">
    <rect width="290" height="124" rx="12" fill="url(#cardGrad)" stroke="#F59E0B" stroke-opacity="0.4" stroke-width="1.2"/>
    
    <!-- Header -->
    <text x="18" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#94A3B8" letter-spacing="1">
      📜 CLOUD &amp; AI EXPERTISE
    </text>
    
    <!-- Big Stat -->
    <text x="18" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="34" font-weight="900" fill="url(#amberNeon)">
      30+
    </text>
    <text x="90" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#FBBF24">
      Google Cloud Badges
    </text>

    <!-- Progress Bar Container -->
    <rect x="18" y="92" width="254" height="6" rx="3" fill="#0B0F19"/>
    <rect x="18" y="92" width="240" height="6" rx="3" fill="url(#amberNeon)">
      <animate attributeName="width" values="100;240;240" dur="2.5s" repeatCount="indefinite"/>
    </rect>
    <text x="18" y="114" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="500" fill="#64748B">
      Google CDL, ACE • 3x AWS Certified
    </text>
  </g>
</svg>
