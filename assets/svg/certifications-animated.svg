<svg fill="none" viewBox="0 0 1200 90" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="certBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="certBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4285F4" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#FF9900" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="90" rx="12" fill="url(#certBg)" stroke="url(#certBorder)" stroke-width="1.5"/>

  <!-- Badge 1: GCP -->
  <g transform="translate(40, 20)">
    <rect width="340" height="50" rx="25" fill="#1E293B" stroke="#4285F4" stroke-width="1.5"/>
    <circle cx="28" cy="25" r="12" fill="#4285F4" fill-opacity="0.2">
      <animate attributeName="r" values="10;15;10" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="28" cy="25" r="6" fill="#4285F4"/>
    <text x="52" y="24" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" fill="#4285F4">GOOGLE CLOUD CERTIFIED</text>
    <text x="52" y="38" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#94A3B8">CDL &amp; ACE • 30+ SKILL BADGES</text>
  </g>

  <!-- Badge 2: AWS -->
  <g transform="translate(430, 20)">
    <rect width="340" height="50" rx="25" fill="#1E293B" stroke="#FF9900" stroke-width="1.5"/>
    <circle cx="28" cy="25" r="12" fill="#FF9900" fill-opacity="0.2">
      <animate attributeName="r" values="10;15;10" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="28" cy="25" r="6" fill="#FF9900"/>
    <text x="52" y="24" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" fill="#FF9900">AWS CERTIFIED PLATFORM</text>
    <text x="52" y="38" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#94A3B8">3X CERTIFIED • BEDROCK SPECIALIST</text>
  </g>

  <!-- Badge 3: IIT Guwahati -->
  <g transform="translate(820, 20)">
    <rect width="340" height="50" rx="25" fill="#1E293B" stroke="#7C3AED" stroke-width="1.5"/>
    <circle cx="28" cy="25" r="12" fill="#7C3AED" fill-opacity="0.2">
      <animate attributeName="r" values="10;15;10" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="28" cy="25" r="6" fill="#7C3AED"/>
    <text x="52" y="24" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" fill="#C084FC">IIT GUWAHATI ACADEMIC</text>
    <text x="52" y="38" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#94A3B8">BSC (HONOURS) DATA SCIENCE &amp; AI</text>
  </g>
</svg>
