<svg fill="none" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep Obsidian Tech Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060911" />
      <stop offset="35%" stop-color="#0B0F19" />
      <stop offset="70%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#070A12" />
    </linearGradient>

    <!-- Glowing Ambient Radial Lights -->
    <radialGradient id="cyanOrb" cx="12%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.18">
        <animate attributeName="stop-opacity" values="0.18;0.08;0.18" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="purpleOrb" cx="88%" cy="75%" r="50%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.22">
        <animate attributeName="stop-opacity" values="0.12;0.25;0.12" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="centerAura" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.08">
        <animate attributeName="stop-opacity" values="0.05;0.12;0.05" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>

    <!-- Luxury Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="30%" stop-color="#00F2FE" />
      <stop offset="60%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- Subtitle Glow Gradient -->
    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <!-- Outer Card Border Glow -->
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.7" />
      <stop offset="40%" stop-color="#38BDF8" stop-opacity="0.2" />
      <stop offset="70%" stop-color="#7C3AED" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0.8" />
    </linearGradient>

    <!-- Pill Border Gradient -->
    <linearGradient id="pillBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.5" />
    </linearGradient>

    <!-- Sleek Tech Grid Pattern -->
    <pattern id="techGrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#38BDF8" stroke-opacity="0.045" stroke-width="1"/>
      <circle cx="36" cy="36" r="1" fill="#00F2FE" fill-opacity="0.15"/>
    </pattern>
  </defs>

  <!-- Base Card Container -->
  <rect width="1200" height="320" rx="18" fill="url(#bgGrad)" stroke="url(#cardBorder)" stroke-width="1.5"/>

  <!-- Subtle Tech Grid -->
  <rect width="1200" height="320" rx="18" fill="url(#techGrid)"/>

  <!-- Ambient Light Layers -->
  <rect width="1200" height="320" rx="18" fill="url(#cyanOrb)"/>
  <rect width="1200" height="320" rx="18" fill="url(#purpleOrb)"/>
  <rect width="1200" height="320" rx="18" fill="url(#centerAura)"/>

  <!-- Corner Ambient Constellation Nodes (Away from text) -->
  <!-- Left Side Constellation -->
  <path d="M 40 80 L 120 50 L 160 110 L 80 140 Z" fill="none" stroke="#00F2FE" stroke-opacity="0.12" stroke-width="1" stroke-dasharray="3,3"/>
  <circle cx="40" cy="80" r="3" fill="#00F2FE" fill-opacity="0.4"/>
  <circle cx="120" cy="50" r="3.5" fill="#38BDF8">
    <animate attributeName="fill-opacity" values="0.3;0.8;0.3" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="160" cy="110" r="2.5" fill="#818CF8" fill-opacity="0.5"/>
  <circle cx="80" cy="140" r="3" fill="#00F2FE" fill-opacity="0.3"/>

  <!-- Right Side Constellation -->
  <path d="M 1160 240 L 1080 270 L 1040 210 L 1120 180 Z" fill="none" stroke="#7C3AED" stroke-opacity="0.15" stroke-width="1" stroke-dasharray="3,3"/>
  <circle cx="1160" cy="240" r="3" fill="#C084FC" fill-opacity="0.4"/>
  <circle cx="1080" cy="270" r="3.5" fill="#7C3AED">
    <animate attributeName="fill-opacity" values="0.3;0.9;0.3" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1040" cy="210" r="2.5" fill="#818CF8" fill-opacity="0.5"/>
  <circle cx="1120" cy="180" r="3" fill="#38BDF8" fill-opacity="0.3"/>

  <!-- ================= HEADER CHIP / STATUS ================= -->
  <g transform="translate(600, 48)">
    <rect x="-195" y="-14" width="390" height="28" rx="14" fill="#0F172A" fill-opacity="0.75" stroke="url(#pillBorder)" stroke-width="1"/>
    
    <!-- Pulsing Live Dot -->
    <circle cx="-170" cy="0" r="6" fill="#10B981" fill-opacity="0.3">
      <animate attributeName="r" values="4;8;4" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="fill-opacity" values="0.5;0;0.5" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-170" cy="0" r="3.5" fill="#10B981"/>

    <!-- Status Text -->
    <text x="-154" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.5" fill="#94A3B8">
      ENTERPRISE AI &amp; MULTI-AGENT ARCHITECTURE
    </text>
  </g>

  <!-- ================= MAIN NAME TITLE ================= -->
  <text x="600" y="128" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="56" font-weight="900" letter-spacing="7" fill="url(#titleGrad)">
    SONU THOMAS
  </text>

  <!-- ================= ROLES & CREDENTIALS ================= -->
  <g transform="translate(600, 172)">
    <text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="16" font-weight="600" letter-spacing="0.8" fill="#E2E8F0">
      <tspan fill="#38BDF8" font-weight="700">Software Engineer (AI/ML)</tspan>
      <tspan fill="#64748B"> @ </tspan>
      <tspan fill="#F8FAFC" font-weight="700">HCLTech</tspan>
      <tspan fill="#64748B">  •  </tspan>
      <tspan fill="#C084FC" font-weight="700">B.Sc. (Honours) Data Science &amp; AI</tspan>
      <tspan fill="#64748B"> @ </tspan>
      <tspan fill="#F8FAFC" font-weight="700">IIT Guwahati</tspan>
    </text>
  </g>

  <!-- ================= PILL CARDS / CORE DOMAINS ================= -->
  <g transform="translate(600, 240)">
    <!-- Pill 1: Multi-Agent Systems -->
    <g transform="translate(-405, 0)">
      <rect x="0" y="0" width="190" height="34" rx="17" fill="#0F172A" fill-opacity="0.8" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="1"/>
      <text x="95" y="21" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif" font-size="12" font-weight="600" fill="#38BDF8" letter-spacing="0.5">
        🤖 Multi-Agent Systems
      </text>
    </g>

    <!-- Pill 2: Enterprise RAG -->
    <g transform="translate(-195, 0)">
      <rect x="0" y="0" width="180" height="34" rx="17" fill="#0F172A" fill-opacity="0.8" stroke="#00F2FE" stroke-opacity="0.35" stroke-width="1"/>
      <text x="90" y="21" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif" font-size="12" font-weight="600" fill="#00F2FE" letter-spacing="0.5">
        🔍 Enterprise RAG
      </text>
    </g>

    <!-- Pill 3: LLM Governance -->
    <g transform="translate(5, 0)">
      <rect x="0" y="0" width="185" height="34" rx="17" fill="#0F172A" fill-opacity="0.8" stroke="#818CF8" stroke-opacity="0.35" stroke-width="1"/>
      <text x="92" y="21" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif" font-size="12" font-weight="600" fill="#818CF8" letter-spacing="0.5">
        🛡️ LLM Governance
      </text>
    </g>

    <!-- Pill 4: Cloud AI & MLOps -->
    <g transform="translate(210, 0)">
      <rect x="0" y="0" width="195" height="34" rx="17" fill="#0F172A" fill-opacity="0.8" stroke="#C084FC" stroke-opacity="0.35" stroke-width="1"/>
      <text x="97" y="21" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif" font-size="12" font-weight="600" fill="#C084FC" letter-spacing="0.5">
        ☁️ Cloud AI &amp; MLOps
      </text>
    </g>
  </g>
</svg>
