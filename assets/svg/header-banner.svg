<svg fill="none" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A12" />
      <stop offset="40%" stop-color="#0F172A" />
      <stop offset="70%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>

    <!-- Glowing Orbs -->
    <radialGradient id="cyanOrb" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="purpleOrb" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0" />
    </radialGradient>

    <!-- Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="35%" stop-color="#38BDF8" />
      <stop offset="70%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- Border Glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#7C3AED" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.8" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38BDF8" stroke-opacity="0.07" stroke-width="1"/>
      <circle cx="40" cy="40" r="1.5" fill="#00F2FE" fill-opacity="0.2"/>
    </pattern>
  </defs>

  <!-- Base Card Container -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2"/>

  <!-- Grid Layer -->
  <rect width="1200" height="320" rx="16" fill="url(#grid)"/>

  <!-- Glowing Ambient Lights -->
  <rect width="1200" height="320" rx="16" fill="url(#cyanOrb)"/>
  <rect width="1200" height="320" rx="16" fill="url(#purpleOrb)"/>

  <!-- Decorative Circuit Lines -->
  <path d="M 50 160 Q 200 40 400 160 T 750 160 T 1150 160" fill="none" stroke="#00F2FE" stroke-opacity="0.15" stroke-width="2" stroke-dasharray="6,6"/>
  <path d="M 100 240 Q 350 300 600 240 T 1100 240" fill="none" stroke="#7C3AED" stroke-opacity="0.2" stroke-width="2"/>

  <!-- Connected Nodes -->
  <circle cx="200" cy="115" r="4" fill="#00F2FE" fill-opacity="0.6"/>
  <circle cx="400" cy="160" r="5" fill="#38BDF8" fill-opacity="0.8"/>
  <circle cx="750" cy="160" r="4" fill="#818CF8" fill-opacity="0.6"/>
  <circle cx="950" cy="205" r="5" fill="#C084FC" fill-opacity="0.8"/>

  <!-- Main Name Title -->
  <text x="600" y="130" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="58" font-weight="900" letter-spacing="6" fill="url(#textGrad)">
    SONU THOMAS
  </text>

  <!-- Subtitle Pill Container -->
  <rect x="220" y="170" width="760" height="42" rx="21" fill="#0F172A" fill-opacity="0.75" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Subtitle Text -->
  <text x="600" y="196" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Fira Code', 'Segoe UI', monospace" font-size="16" font-weight="700" letter-spacing="2" fill="#E2E8F0">
    SOFTWARE ENGINEER (AI/ML) @ HCLTECH • BSC DATA SCIENCE &amp; AI @ IIT GUWAHATI
  </text>

  <!-- Feature Tagline -->
  <text x="600" y="252" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500" letter-spacing="3" fill="#94A3B8">
    ENTERPRISE AI PLATFORMS • MULTI-AGENT SYSTEMS • LLM GOVERNANCE • CLOUD AI
  </text>
</svg>
