<svg viewBox="0 0 1200 320" width="1200" height="320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060911" />
      <stop offset="40%" stop-color="#0B0F19" />
      <stop offset="80%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#070A12" />
    </linearGradient>

    <!-- Card Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.8" />
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="30%" stop-color="#00F2FE" />
      <stop offset="70%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- Subtitle Pill Gradient -->
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.6" />
    </linearGradient>

    <!-- Radial Ambient Lights -->
    <radialGradient id="cyanLight" cx="15%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="purpleLight" cx="85%" cy="70%" r="45%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Base Card Container -->
  <rect width="1200" height="320" rx="18" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Ambient Light Backdrops -->
  <rect width="1200" height="320" rx="18" fill="url(#cyanLight)"/>
  <rect width="1200" height="320" rx="18" fill="url(#purpleLight)"/>

  <!-- Clean Grid Accent Lines (Camo-Safe) -->
  <g stroke="#38BDF8" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="200" y1="0" x2="200" y2="320"/>
    <line x1="400" y1="0" x2="400" y2="320"/>
    <line x1="600" y1="0" x2="600" y2="320"/>
    <line x1="800" y1="0" x2="800" y2="320"/>
    <line x1="1000" y1="0" x2="1000" y2="320"/>
  </g>

  <!-- Left Side Constellation Nodes -->
  <g stroke="#00F2FE" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="4,4">
    <line x1="60" y1="90" x2="140" y2="50"/>
    <line x1="140" y1="50" x2="180" y2="120"/>
    <line x1="180" y1="120" x2="90" y2="150"/>
  </g>
  <circle cx="60" cy="90" r="3" fill="#00F2FE" opacity="0.6"/>
  <circle cx="140" cy="50" r="4" fill="#38BDF8">
    <animate attributeName="opacity" values="0.3;0.9;0.3" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="180" cy="120" r="3" fill="#818CF8" opacity="0.7"/>
  <circle cx="90" cy="150" r="3.5" fill="#00F2FE" opacity="0.5"/>

  <!-- Right Side Constellation Nodes -->
  <g stroke="#7C3AED" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="4,4">
    <line x1="1140" y1="230" x2="1060" y2="260"/>
    <line x1="1060" y1="260" x2="1020" y2="190"/>
    <line x1="1020" y1="190" x2="1100" y2="160"/>
  </g>
  <circle cx="1140" cy="230" r="3.5" fill="#C084FC" opacity="0.6"/>
  <circle cx="1060" cy="260" r="4" fill="#7C3AED">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1020" cy="190" r="3" fill="#818CF8" opacity="0.7"/>
  <circle cx="1100" cy="160" r="3.5" fill="#38BDF8" opacity="0.5"/>

  <!-- ================= TOP STATUS BADGE ================= -->
  <g transform="translate(600, 48)">
    <rect x="-210" y="-14" width="420" height="28" rx="14" fill="#0F172A" fill-opacity="0.85" stroke="url(#pillGrad)" stroke-width="1"/>
    
    <!-- Pulsing Live Green Indicator -->
    <circle cx="-185" cy="0" r="6" fill="#10B981" fill-opacity="0.25">
      <animate attributeName="r" values="4;8;4" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="fill-opacity" values="0.4;0;0.4" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-185" cy="0" r="3.5" fill="#10B981"/>

    <!-- Status Text -->
    <text x="-168" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#94A3B8">
      ENTERPRISE AI &amp; MULTI-AGENT ARCHITECTURE
    </text>
  </g>

  <!-- ================= MAIN NAME TITLE ================= -->
  <text x="600" y="128" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="900" letter-spacing="7" fill="url(#titleGrad)">
    SONU THOMAS
  </text>

  <!-- ================= CREDENTIALS BAR ================= -->
  <g transform="translate(600, 172)">
    <text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" letter-spacing="0.5">
      <tspan fill="#38BDF8" font-weight="700">Software Engineer (AI/ML)</tspan>
      <tspan fill="#64748B"> @ </tspan>
      <tspan fill="#F8FAFC" font-weight="700">HCLTech</tspan>
      <tspan fill="#64748B">  •  </tspan>
      <tspan fill="#C084FC" font-weight="700">B.Sc. (Honours) Data Science &amp; AI</tspan>
      <tspan fill="#64748B"> @ </tspan>
      <tspan fill="#F8FAFC" font-weight="700">IIT Guwahati</tspan>
    </text>
  </g>

  <!-- ================= DOMAIN CHIPS ================= -->
  <g transform="translate(600, 240)">
    <!-- Pill 1: Multi-Agent Systems -->
    <g transform="translate(-405, 0)">
      <rect x="0" y="0" width="190" height="34" rx="17" fill="#0F172A" fill-opacity="0.9" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="1.2"/>
      <text x="95" y="21" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#38BDF8" letter-spacing="0.5">
        Multi-Agent Systems
      </text>
    </g>

    <!-- Pill 2: Enterprise RAG -->
    <g transform="translate(-195, 0)">
      <rect x="0" y="0" width="180" height="34" rx="17" fill="#0F172A" fill-opacity="0.9" stroke="#00F2FE" stroke-opacity="0.4" stroke-width="1.2"/>
      <text x="90" y="21" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#00F2FE" letter-spacing="0.5">
        Enterprise RAG
      </text>
    </g>

    <!-- Pill 3: LLM Governance -->
    <g transform="translate(5, 0)">
      <rect x="0" y="0" width="185" height="34" rx="17" fill="#0F172A" fill-opacity="0.9" stroke="#818CF8" stroke-opacity="0.4" stroke-width="1.2"/>
      <text x="92" y="21" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#818CF8" letter-spacing="0.5">
        LLM Governance
      </text>
    </g>

    <!-- Pill 4: Cloud AI & MLOps -->
    <g transform="translate(210, 0)">
      <rect x="0" y="0" width="195" height="34" rx="17" fill="#0F172A" fill-opacity="0.9" stroke="#C084FC" stroke-opacity="0.4" stroke-width="1.2"/>
      <text x="97" y="21" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#C084FC" letter-spacing="0.5">
        Cloud AI &amp; MLOps
      </text>
    </g>
  </g>
</svg>
