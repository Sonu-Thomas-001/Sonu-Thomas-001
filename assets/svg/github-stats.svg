<svg viewBox="0 0 490 195" width="490" height="195" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="statsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060911"/>
      <stop offset="50%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="statsBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.7"/>
    </linearGradient>
  </defs>

  <rect width="490" height="195" rx="12" fill="url(#statsBg)" stroke="url(#statsBorder)" stroke-width="1.2"/>

  <!-- Title -->
  <text x="24" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="800" fill="#00F2FE" letter-spacing="0.8">
    GitHub Account Statistics &amp; Rank
  </text>
  
  <g transform="translate(425, 24)">
    <rect x="-42" y="-10" width="70" height="20" rx="10" fill="#00F2FE" fill-opacity="0.1" stroke="#00F2FE" stroke-opacity="0.4" stroke-width="1"/>
    <text x="-7" y="4" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="800" fill="#00F2FE">
      RANK A+
    </text>
  </g>

  <!-- Divider line -->
  <line x1="24" y1="44" x2="466" y2="44" stroke="#334155" stroke-opacity="0.6" stroke-width="1"/>

  <!-- Metric 1: Total Commits & PRs -->
  <g transform="translate(24, 72)">
    <circle cx="6" cy="-4" r="3.5" fill="#00F2FE"/>
    <text x="18" y="0" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#E2E8F0">Total Contributions:</text>
    <text x="442" y="0" text-anchor="end" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" fill="#00F2FE">500+ Commits &amp; PRs</text>
  </g>

  <!-- Metric 2: Pull Request Merge Rate -->
  <g transform="translate(24, 100)">
    <circle cx="6" cy="-4" r="3.5" fill="#818CF8"/>
    <text x="18" y="0" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#E2E8F0">PR Merge &amp; Acceptance:</text>
    <text x="442" y="0" text-anchor="end" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" fill="#818CF8">100% Merged</text>
  </g>

  <!-- Metric 3: AI & OSS Repositories -->
  <g transform="translate(24, 128)">
    <circle cx="6" cy="-4" r="3.5" fill="#34D399"/>
    <text x="18" y="0" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#E2E8F0">Enterprise &amp; AI Repositories:</text>
    <text x="442" y="0" text-anchor="end" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" fill="#34D399">Production-Grade</text>
  </g>

  <!-- Metric 4: Code Security & Review Score -->
  <g transform="translate(24, 156)">
    <circle cx="6" cy="-4" r="3.5" fill="#F59E0B"/>
    <text x="18" y="0" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#E2E8F0">CI/CD Guardrails &amp; Security:</text>
    <text x="442" y="0" text-anchor="end" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" fill="#FBBF24">100% Passed</text>
  </g>

  <!-- Bottom Tag -->
  <text x="24" y="184" font-family="-apple-system, monospace" font-size="9" font-weight="600" fill="#64748B">
    VERIFIED METRICS • HCLTECH &amp; IIT GUWAHATI
  </text>
</svg>
