<svg fill="none" viewBox="0 0 1200 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background -->
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060911"/>
      <stop offset="50%" stop-color="#0A0E1A"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Header Gradient -->
    <linearGradient id="termHead" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>

  <!-- Main Terminal Window Frame -->
  <rect width="1200" height="240" rx="14" fill="url(#termBg)" stroke="#334155" stroke-width="1.2"/>

  <!-- Top Titlebar -->
  <path d="M 0 14 C 0 6.268 6.268 0 14 0 L 1186 0 C 1193.73 0 1200 6.268 1200 14 L 1200 38 L 0 38 Z" fill="url(#termHead)" stroke="#334155" stroke-width="0.5"/>

  <!-- Window Controls -->
  <circle cx="24" cy="19" r="6" fill="#EF4444"/>
  <circle cx="44" cy="19" r="6" fill="#F59E0B"/>
  <circle cx="64" cy="19" r="6" fill="#10B981"/>

  <!-- Tab / Title -->
  <rect x="100" y="6" width="310" height="26" rx="6" fill="#060911" stroke="#334155" stroke-width="0.8"/>
  <text x="120" y="23" font-family="-apple-system, 'Fira Code', monospace" font-size="11.5" font-weight="600" fill="#38BDF8">
    🐍 sonu_thomas_agent.py — Enterprise AI Engine
  </text>

  <!-- Live Pulse Dot on Header Right -->
  <g transform="translate(1120, 19)">
    <circle cx="0" cy="0" r="4" fill="#10B981">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="12" y="4" font-family="-apple-system, monospace" font-size="10.5" font-weight="700" fill="#10B981">
      ACTIVE
    </text>
  </g>

  <!-- Code Content Area -->
  <g transform="translate(30, 64)" font-family="'Fira Code', 'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="500" xml:space="preserve">
    <!-- Line 1 -->
    <text y="0" fill="#64748B">01  </text>
    <text x="35" y="0" fill="#C084FC">class</text>
    <text x="85" y="0" fill="#38BDF8">SonuThomas</text>
    <text x="175" y="0" fill="#94A3B8">(EnterpriseAIEngineer):</text>

    <!-- Line 2 -->
    <text y="24" fill="#64748B">02  </text>
    <text x="35" y="24" fill="#C084FC">    def</text>
    <text x="110" y="24" fill="#818CF8">__init__</text>
    <text x="180" y="24" fill="#94A3B8">(self):</text>

    <!-- Line 3 -->
    <text y="48" fill="#64748B">03  </text>
    <text x="35" y="48" fill="#94A3B8">        self.role = </text>
    <text x="210" y="48" fill="#34D399">"Software Engineer (AI/ML) @ HCLTech"</text>

    <!-- Line 4 -->
    <text y="72" fill="#64748B">04  </text>
    <text x="35" y="72" fill="#94A3B8">        self.academic = </text>
    <text x="245" y="72" fill="#34D399">"B.Sc. (Honours) Data Science &amp; AI @ IIT Guwahati"</text>

    <!-- Line 5 -->
    <text y="96" fill="#64748B">05  </text>
    <text x="35" y="96" fill="#94A3B8">        self.specialization = [</text>
    <text x="285" y="96" fill="#00F2FE">"Multi-Agent Systems"</text>
    <text x="460" y="96" fill="#94A3B8">, </text>
    <text x="480" y="96" fill="#00F2FE">"Enterprise RAG"</text>
    <text x="615" y="96" fill="#94A3B8">, </text>
    <text x="635" y="96" fill="#00F2FE">"LLM Governance"</text>
    <text x="770" y="96" fill="#94A3B8">]</text>

    <!-- Line 6 -->
    <text y="120" fill="#64748B">06  </text>
    <text x="35" y="120" fill="#C084FC">    async def</text>
    <text x="160" y="120" fill="#818CF8">deploy_solution</text>
    <text x="290" y="120" fill="#94A3B8">(self, incident): </text>
    <text x="450" y="120" fill="#C084FC">return await</text>
    <text x="565" y="120" fill="#38BDF8">self.orchestrator.solve(incident)</text>

    <!-- Blinking Cursor -->
    <rect x="855" y="108" width="8" height="15" fill="#00F2FE">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Bottom Status Bar -->
  <g transform="translate(0, 212)">
    <rect width="1200" height="28" fill="#0F172A" stroke="#334155" stroke-width="0.5"/>
    <text x="24" y="18" font-family="-apple-system, monospace" font-size="10.5" font-weight="700" fill="#94A3B8">
      ⚡ <tspan fill="#10B981">PYTHON 3.12</tspan> | <tspan fill="#38BDF8">LANGGRAPH 0.2</tspan> | <tspan fill="#C084FC">VERTEX AI AGENTS</tspan> | <tspan fill="#00F2FE">0 ERRORS</tspan> | <tspan fill="#F59E0B">PRODUCTION-READY</tspan>
    </text>
    <text x="1160" y="18" text-anchor="end" font-family="-apple-system, monospace" font-size="10.5" font-weight="600" fill="#64748B">
      UTF-8 • Ln 06, Col 42
    </text>
  </g>
</svg>
