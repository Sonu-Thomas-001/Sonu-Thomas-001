<svg fill="none" viewBox="0 0 1200 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tickerBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="tickerBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.5" />
    </linearGradient>
  </defs>

  <!-- Container Box -->
  <rect width="1200" height="64" rx="12" fill="url(#tickerBg)" stroke="url(#tickerBorder)" stroke-width="1.5"/>

  <!-- Live Pulsing Beacon -->
  <g transform="translate(40, 32)">
    <circle cx="0" cy="0" r="10" fill="#10B981" fill-opacity="0.2">
      <animate attributeName="r" values="8;16;8" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="fill-opacity" values="0.4;0;0.4" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="6" fill="#10B981"/>
  </g>

  <!-- Title -->
  <text x="65" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" fill="#10B981" letter-spacing="1">
    LIVE FOCUS:
  </text>

  <!-- Ticker Text Stream -->
  <g transform="translate(180, 38)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Fira Code', monospace" font-size="14" font-weight="600" fill="#38BDF8">
      <tspan x="0" y="0">Architecting Centralized AI Agent Platforms &amp; Multi-Agent Systems</tspan>
      <animate attributeName="opacity" values="1;0.2;1" dur="4s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Right side tag -->
  <g transform="translate(1000, 20)">
    <rect x="0" y="0" width="160" height="26" rx="13" fill="#00F2FE" fill-opacity="0.1" stroke="#00F2FE" stroke-width="1"/>
    <text x="80" y="17" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#00F2FE">
      ⚡ PRODUCTION READY
    </text>
  </g>
</svg>
