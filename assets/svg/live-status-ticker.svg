<svg fill="none" viewBox="0 0 1200 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tickerBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#060911" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>
    <linearGradient id="tickerBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#7C3AED" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.6" />
    </linearGradient>
  </defs>

  <!-- Container Box -->
  <rect width="1200" height="64" rx="12" fill="url(#tickerBg)" stroke="url(#tickerBorder)" stroke-width="1.2"/>

  <!-- Live Pulsing Beacon -->
  <g transform="translate(36, 32)">
    <circle cx="0" cy="0" r="10" fill="#10B981" fill-opacity="0.2">
      <animate attributeName="r" values="6;14;6" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="fill-opacity" values="0.4;0;0.4" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="5" fill="#10B981"/>
  </g>

  <!-- Title Badge -->
  <g transform="translate(56, 32)">
    <text y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="800" fill="#10B981" letter-spacing="1.5">
      LIVE FOCUS:
    </text>
  </g>

  <!-- Multi-Phase Animated Text Ticker -->
  <g transform="translate(180, 32)">
    <!-- Phase 1 -->
    <text y="4" font-family="-apple-system, BlinkMacSystemFont, 'Fira Code', monospace" font-size="13.5" font-weight="600" fill="#38BDF8">
      Architecting Centralized AI Agent Platforms &amp; Multi-Agent Systems
      <animate attributeName="opacity" values="1;1;0;0;0;0;0;0" keyTimes="0;0.22;0.25;0.75;0.75;0.75;0.97;1" dur="12s" repeatCount="indefinite"/>
    </text>
    
    <!-- Phase 2 -->
    <text y="4" font-family="-apple-system, BlinkMacSystemFont, 'Fira Code', monospace" font-size="13.5" font-weight="600" fill="#C084FC">
      Building Enterprise Context RAG with Vertex Search &amp; ChromaDB
      <animate attributeName="opacity" values="0;0;1;1;0;0;0;0" keyTimes="0;0.25;0.28;0.47;0.50;0.75;0.97;1" dur="12s" repeatCount="indefinite"/>
    </text>

    <!-- Phase 3 -->
    <text y="4" font-family="-apple-system, BlinkMacSystemFont, 'Fira Code', monospace" font-size="13.5" font-weight="600" fill="#00F2FE">
      Developing Autonomous ITSM Incident &amp; Root-Cause Analysis (RCA) Copilots
      <animate attributeName="opacity" values="0;0;0;0;1;1;0;0" keyTimes="0;0.47;0.50;0.53;0.72;0.75;0.97;1" dur="12s" repeatCount="indefinite"/>
    </text>

    <!-- Phase 4 -->
    <text y="4" font-family="-apple-system, BlinkMacSystemFont, 'Fira Code', monospace" font-size="13.5" font-weight="600" fill="#34D399">
      Designing Enterprise-Scale LLM Governance &amp; Security Guardrails
      <animate attributeName="opacity" values="0;0;0;0;0;0;1;1" keyTimes="0;0.72;0.75;0.78;0.94;0.97;0.97;1" dur="12s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Right side tag -->
  <g transform="translate(1010, 20)">
    <rect x="0" y="0" width="160" height="26" rx="13" fill="#00F2FE" fill-opacity="0.1" stroke="#00F2FE" stroke-opacity="0.5" stroke-width="1"/>
    <text x="80" y="17" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#00F2FE">
      ⚡ PRODUCTION READY
    </text>
  </g>
</svg>
