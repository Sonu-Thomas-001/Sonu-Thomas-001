<svg fill="none" viewBox="0 0 1200 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="meshBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060911"/>
      <stop offset="50%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Card Background -->
    <linearGradient id="agentCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Center Node Gradient -->
    <radialGradient id="centerOrch" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#3B82F6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0.9"/>
    </radialGradient>

    <!-- Laser Connections -->
    <linearGradient id="beam1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <linearGradient id="beam2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#00F2FE"/>
    </linearGradient>
  </defs>

  <!-- Container -->
  <rect width="1200" height="220" rx="16" fill="url(#meshBg)" stroke="#334155" stroke-width="1.2"/>

  <!-- Top Title & Live Status -->
  <g transform="translate(40, 28)">
    <text font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#00F2FE" letter-spacing="1.5">
      ⚡ ENTERPRISE MULTI-AGENT COLLABORATION PROTOCOL
    </text>
    
    <!-- Real-time Metrics on right -->
    <g transform="translate(820, -6)">
      <rect width="300" height="26" rx="13" fill="#0B0F19" stroke="#334155" stroke-width="1"/>
      <circle cx="15" cy="13" r="4" fill="#10B981">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      <text x="26" y="17" font-family="-apple-system, monospace" font-size="11" font-weight="700" fill="#E2E8F0">
        LATENCY: <tspan fill="#00F2FE">140ms</tspan> • CONSENSUS: <tspan fill="#10B981">99.8%</tspan>
      </text>
    </g>
  </g>

  <!-- Connection Beams from Center (600, 125) to Sub-Agents -->
  <!-- Line to Agent 1 (180, 85) -->
  <line x1="600" y1="125" x2="180" y2="85" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="4,4"/>
  <!-- Line to Agent 2 (180, 165) -->
  <line x1="600" y1="125" x2="180" y2="165" stroke="#7C3AED" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="4,4"/>
  <!-- Line to Agent 3 (1020, 85) -->
  <line x1="600" y1="125" x2="1020" y2="85" stroke="#10B981" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="4,4"/>
  <!-- Line to Agent 4 (1020, 165) -->
  <line x1="600" y1="125" x2="1020" y2="165" stroke="#F59E0B" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Animated Data Packets travelling between nodes -->
  <circle cx="0" cy="0" r="4" fill="#00F2FE">
    <animateMotion path="M 600,125 L 180,85" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="0" cy="0" r="4" fill="#7C3AED">
    <animateMotion path="M 180,165 L 600,125" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="0" cy="0" r="4" fill="#10B981">
    <animateMotion path="M 600,125 L 1020,85" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="0" cy="0" r="4" fill="#F59E0B">
    <animateMotion path="M 1020,165 L 600,125" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- ================= CENTER ORCHESTRATOR NODE ================= -->
  <g transform="translate(600, 125)">
    <!-- Outer Glow Wave -->
    <circle cx="0" cy="0" r="54" fill="#00F2FE" fill-opacity="0.1">
      <animate attributeName="r" values="46;62;46" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="fill-opacity" values="0.15;0.02;0.15" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Outer Ring -->
    <circle cx="0" cy="0" r="46" fill="#0B0F19" stroke="#00F2FE" stroke-width="2"/>
    <circle cx="0" cy="0" r="40" fill="url(#centerOrch)"/>
    
    <!-- Central Icon & Label -->
    <text x="0" y="-4" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="900" fill="#FFFFFF" letter-spacing="0.5">
      AGENT
    </text>
    <text x="0" y="12" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" fill="#E0F2FE" letter-spacing="1">
      ORCHESTRATOR
    </text>
    <text x="0" y="24" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="7.5" font-weight="700" fill="#93C5FD">
      LangGraph • Vertex
    </text>
  </g>

  <!-- ================= SUB-AGENT 1: Incident Triaging ================= -->
  <g transform="translate(50, 65)">
    <rect width="210" height="42" rx="10" fill="url(#agentCard)" stroke="#38BDF8" stroke-width="1.2"/>
    <circle cx="16" cy="21" r="5" fill="#38BDF8">
      <animate attributeName="opacity" values="1;0.4;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="30" y="19" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#F8FAFC">
      Autonomous Triaging
    </text>
    <text x="30" y="32" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="500" fill="#38BDF8">
      Incident Classification Agent
    </text>
  </g>

  <!-- ================= SUB-AGENT 2: RAG & Search ================= -->
  <g transform="translate(50, 145)">
    <rect width="210" height="42" rx="10" fill="url(#agentCard)" stroke="#7C3AED" stroke-width="1.2"/>
    <circle cx="16" cy="21" r="5" fill="#7C3AED">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="30" y="19" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#F8FAFC">
      Knowledge Retrieval
    </text>
    <text x="30" y="32" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="500" fill="#C084FC">
      Vertex Search &amp; ChromaDB
    </text>
  </g>

  <!-- ================= SUB-AGENT 3: RCA & Synthesis ================= -->
  <g transform="translate(940, 65)">
    <rect width="210" height="42" rx="10" fill="url(#agentCard)" stroke="#10B981" stroke-width="1.2"/>
    <circle cx="16" cy="21" r="5" fill="#10B981">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <text x="30" y="19" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#F8FAFC">
      Root Cause Analysis
    </text>
    <text x="30" y="32" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="500" fill="#34D399">
      Telemetry &amp; Log Synthesis
    </text>
  </g>

  <!-- ================= SUB-AGENT 4: Change & CAB Governance ================= -->
  <g transform="translate(940, 145)">
    <rect width="210" height="42" rx="10" fill="url(#agentCard)" stroke="#F59E0B" stroke-width="1.2"/>
    <circle cx="16" cy="21" r="5" fill="#F59E0B">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.7s" repeatCount="indefinite"/>
    </circle>
    <text x="30" y="19" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#F8FAFC">
      Governance &amp; CAB
    </text>
    <text x="30" y="32" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="500" fill="#FBBF24">
      Risk Evaluation &amp; Policy Agent
    </text>
  </g>
</svg>
