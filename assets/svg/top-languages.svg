<svg viewBox="0 0 490 195" width="490" height="195" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="langBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060911"/>
      <stop offset="50%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="langBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stroke-opacity="0.7"/>
      <stop offset="100%" stop-color="#818CF8" stroke-opacity="0.7"/>
    </linearGradient>
  </defs>

  <rect width="490" height="195" rx="12" fill="url(#langBg)" stroke="url(#langBorder)" stroke-width="1.2"/>

  <!-- Title -->
  <text x="24" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="800" fill="#38BDF8" letter-spacing="0.8">
    Most Used Languages &amp; Stack
  </text>
  
  <text x="466" y="32" text-anchor="end" font-family="-apple-system, monospace" font-size="9.5" font-weight="700" fill="#64748B">
    PRIMARY: PYTHON
  </text>

  <!-- Divider line -->
  <line x1="24" y1="44" x2="466" y2="44" stroke="#334155" stroke-opacity="0.6" stroke-width="1"/>

  <!-- Lang 1: Python (52%) -->
  <g transform="translate(24, 68)">
    <text x="0" y="0" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#E2E8F0">Python (AI/ML &amp; Agents)</text>
    <text x="442" y="0" text-anchor="end" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="800" fill="#38BDF8">52%</text>
    <rect x="0" y="6" width="442" height="7" rx="3.5" fill="#1E293B"/>
    <rect x="0" y="6" width="230" height="7" rx="3.5" fill="#38BDF8"/>
  </g>

  <!-- Lang 2: TypeScript / JS (26%) -->
  <g transform="translate(24, 102)">
    <text x="0" y="0" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#E2E8F0">TypeScript / JavaScript (Full Stack)</text>
    <text x="442" y="0" text-anchor="end" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="800" fill="#818CF8">26%</text>
    <rect x="0" y="6" width="442" height="7" rx="3.5" fill="#1E293B"/>
    <rect x="0" y="6" width="115" height="7" rx="3.5" fill="#818CF8"/>
  </g>

  <!-- Lang 3: Java (12%) -->
  <g transform="translate(24, 136)">
    <text x="0" y="0" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#E2E8F0">Java &amp; Enterprise Backend</text>
    <text x="442" y="0" text-anchor="end" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="800" fill="#F59E0B">12%</text>
    <rect x="0" y="6" width="442" height="7" rx="3.5" fill="#1E293B"/>
    <rect x="0" y="6" width="53" height="7" rx="3.5" fill="#F59E0B"/>
  </g>

  <!-- Lang 4: SQL & Data (10%) -->
  <g transform="translate(24, 170)">
    <text x="0" y="0" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#E2E8F0">SQL, PL/SQL &amp; Vector Databases</text>
    <text x="442" y="0" text-anchor="end" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="800" fill="#10B981">10%</text>
    <rect x="0" y="6" width="442" height="7" rx="3.5" fill="#1E293B"/>
    <rect x="0" y="6" width="44" height="7" rx="3.5" fill="#10B981"/>
  </g>
</svg>
