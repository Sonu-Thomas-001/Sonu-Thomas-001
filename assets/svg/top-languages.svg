<svg fill="none" viewBox="0 0 490 195" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="langBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="langBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3572A5" stroke-opacity="0.6"/>
      <stop offset="100%" stop-color="#00F2FE" stroke-opacity="0.6"/>
    </linearGradient>
  </defs>

  <rect width="490" height="195" rx="12" fill="url(#langBg)" stroke="url(#langBorder)" stroke-width="1.5"/>

  <!-- Title -->
  <text x="25" y="35" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="800" fill="#3572A5" letter-spacing="1">
    Most Used Languages &amp; Stack
  </text>

  <!-- Divider line -->
  <line x1="25" y1="48" x2="465" y2="48" stroke="#334155" stroke-width="1"/>

  <!-- Lang 1: Python (48%) -->
  <g transform="translate(25, 75)">
    <text x="0" y="0" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#E2E8F0">Python</text>
    <text x="440" y="0" text-anchor="end" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#3572A5">48%</text>
    <rect x="0" y="8" width="440" height="8" rx="4" fill="#1E293B"/>
    <rect x="0" y="8" width="211" height="8" rx="4" fill="#3572A5"/>
  </g>

  <!-- Lang 2: TypeScript / JS (28%) -->
  <g transform="translate(25, 110)">
    <text x="0" y="0" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#E2E8F0">TypeScript / JavaScript</text>
    <text x="440" y="0" text-anchor="end" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#3178C6">28%</text>
    <rect x="0" y="8" width="440" height="8" rx="4" fill="#1E293B"/>
    <rect x="0" y="8" width="123" height="8" rx="4" fill="#3178C6"/>
  </g>

  <!-- Lang 3: Java & SQL (14%) -->
  <g transform="translate(25, 145)">
    <text x="0" y="0" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#E2E8F0">Java &amp; SQL / PLSQL</text>
    <text x="440" y="0" text-anchor="end" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#B07219">14%</text>
    <rect x="0" y="8" width="440" height="8" rx="4" fill="#1E293B"/>
    <rect x="0" y="8" width="61" height="8" rx="4" fill="#B07219"/>
  </g>
</svg>
